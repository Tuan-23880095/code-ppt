<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Bài Giảng</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <img src="https://hcmus.edu.vn/wp-content/uploads/2023/04/Logo-chinh-e1681638380305.png" alt="Logo HCMUS" class="h-12 w-auto object-contain">
                <div class="h-8 w-px bg-slate-300 hidden sm:block"></div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">Cổng Quản Lý Trình Chiếu</h1>
                    <p class="text-xs font-semibold text-blue-600 uppercase tracking-wider">Tài liệu Giảng dạy Nội bộ - Bộ môn Địa chất</p>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-5xl mx-auto px-4 py-10 flex-grow w-full">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-slate-900 mb-3">Danh Sách Học Phần</h2>
            <p class="text-slate-600 text-sm max-w-2xl mx-auto">
                Lựa chọn chuyên đề để khởi chạy trình phát Slide. Hệ thống sẽ tự động tải dữ liệu thời gian thực từ Google Sheets.
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- KHU VỰC 1: KỸ NĂNG MỀM -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-indigo-50 border-b border-indigo-100 px-6 py-4">
                    <h3 class="text-lg font-bold text-indigo-900 flex items-center">
                        <i class="fas fa-users-cog text-indigo-600 mr-2 text-xl"></i>
                        Nhóm kỹ năng & Học tập (BAA00008)
                    </h3>
                </div>
                <!-- Div rỗng để vòng lặp JS nhồi dữ liệu vào -->
                <div id="list-kynang" class="p-6 space-y-4"></div>
            </div>

            <!-- KHU VỰC 2: CHUYÊN NGÀNH ĐỊA CHẤT -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-emerald-50 border-b border-emerald-100 px-6 py-4">
                    <h3 class="text-lg font-bold text-emerald-900 flex items-center">
                        <i class="fas fa-globe-asia text-emerald-600 mr-2 text-xl"></i>
                        Chuyên ngành Địa chất
                    </h3>
                </div>
                <!-- Div rỗng để vòng lặp JS nhồi dữ liệu vào -->
                <div id="list-diachat" class="p-6 space-y-4"></div>
            </div>

        </div>
    </main>

    <!-- KỊCH BẢN JAVASCRIPT: VÒNG LẶP RENDER DỮ LIỆU -->
    <script>
        // 1. MẢNG DỮ LIỆU BÀI GIẢNG (Khai báo tại đây)
        // Khi có bài mới, bạn chỉ cần copy 1 dòng và đổi tên sheetName (tên Tab Google Sheets)
        const lessonData = [
            // CÁC BÀI THUỘC NHÓM KỸ NĂNG
            { sheetName: "BAA00008-Tuan1", title: "Tuần 1: Kỹ năng giao tiếp cơ bản", desc: "Dành cho sinh viên năm nhất", category: "kynang", theme: "indigo" },
            { sheetName: "BAA00008-Tuan2", title: "Tuần 2: Xây dựng nhóm hiệu quả", desc: "Giao tiếp & Giải quyết xung đột", category: "kynang", theme: "indigo" },
            { sheetName: "BAA00008-Tuan3", title: "Tuần 3: Trình bày thuyết phục", desc: "Kỹ năng nói trước đám đông", category: "kynang", theme: "indigo" },
            
            // CÁC BÀI THUỘC CHUYÊN NGÀNH ĐỊA CHẤT
            { sheetName: "DC-MoiTruongTramTich", title: "Môi trường Trầm tích", desc: "Đặc điểm thạch học & Tiến hóa", category: "diachat", theme: "emerald" },
            { sheetName: "DC-PhucHeKhamDuc", title: "Tiến hóa phức hệ Khâm Đức", desc: "Báo cáo tiến độ dự án NCKH", category: "diachat", theme: "emerald" },
            { sheetName: "DC-ThachHocDaTramTich", title: "Thạch học đá Trầm tích", desc: "Phân loại và cấu tạo", category: "diachat", theme: "emerald" }
        ];

        // 2. HÀM TẠO GIAO DIỆN MỘT NÚT BẤM (Dùng chung cho cả vòng lặp)
        function createLessonCard(item, index) {
            return `
                <div class="flex items-center justify-between p-4 rounded-xl border border-slate-100 bg-slate-50 hover:bg-${item.theme}-50/50 hover:border-${item.theme}-200 transition-colors group">
                    <div class="flex items-start space-x-3">
                        <div class="mt-1 w-8 h-8 rounded-full bg-${item.theme}-100 text-${item.theme}-600 flex items-center justify-center font-bold text-sm shrink-0">
                            ${index + 1}
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-800 group-hover:text-${item.theme}-700 transition-colors">${item.title}</h4>
                            <p class="text-xs text-slate-500 mt-1">${item.desc}</p>
                        </div>
                    </div>
                    <a href="index.html?lesson=${item.sheetName}" target="_blank" class="shrink-0 px-4 py-2 bg-${item.theme}-600 hover:bg-${item.theme}-700 text-white text-sm font-semibold rounded-lg shadow-sm transition-transform active:scale-95">
                        <i class="fas fa-play mr-1"></i> Mở Slide
                    </a>
                </div>
            `;
        }

        // 3. VÒNG LẶP RENDER DỮ LIỆU VÀO ĐÚNG KHU VỰC
        document.addEventListener('DOMContentLoaded', () => {
            let kynangHtml = '';
            let diachatHtml = '';
            
            // Đếm số thứ tự riêng cho từng nhóm
            let indexKyNang = 0;
            let indexDiaChat = 0;

            // Vòng lặp quét qua toàn bộ mảng dữ liệu
            lessonData.forEach(item => {
                if (item.category === "kynang") {
                    kynangHtml += createLessonCard(item, indexKyNang);
                    indexKyNang++;
                } else if (item.category === "diachat") {
                    diachatHtml += createLessonCard(item, indexDiaChat);
                    indexDiaChat++;
                }
            });

            // Đổ HTML đã tạo vào giao diện
            document.getElementById('list-kynang').innerHTML = kynangHtml;
            document.getElementById('list-diachat').innerHTML = diachatHtml;
        });
    </script>
</body>
</html>
